services:
  redis:
    profiles: ["redis-only", "redis-ext", "redis-ext-app", "redis-app"]
    image: redis:7.4
    container_name: redis-ha
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 1gb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
      --port ${REDIS_PORT}
      --bind 0.0.0.0
    restart: unless-stopped
    expose:
      - ${REDIS_PORT}
    ports:
      - ${REDIS_PORT}:${REDIS_PORT}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 512M
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    sysctls:
      net.core.somaxconn: 1024
    environment:
      - TZ=UTC
    networks:
      - redis-network

  redis-exporter:
    profiles: ["redis-ext", "redis-ext-app"]
    image: oliver006/redis_exporter:latest
    container_name: redis-exporter
    restart: unless-stopped
    ports:
      - "9121:9121"
    environment:
      - REDIS_ADDR=redis://redis:${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    depends_on:
      - redis
    networks:
      - redis-network

  redis-backup:
    profiles: ["redis-ext", "redis-ext-app"]
    image: redis:7.4
    container_name: redis-backup
    volumes:
      - redis-backups:/backups
      - ./redis/backup-script.sh:/backup-script.sh
    entrypoint: ["/bin/bash", "-c"]
    command: >
      "chmod +x /backup-script.sh &&
       echo '0 */6 * * * /backup-script.sh' > /etc/crontabs/root &&
       crond -f -d 8"
    depends_on:
      - redis
    networks:
      - redis-network

  streamlit-app:
    profiles: ["redis-app", "redis-ext-app", "app-only"]
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: streamlit-redis-app
    restart: unless-stopped
    ports:
      - "8501:8501"
    volumes:
      - ./app:/app
    environment:
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_HOST_REPLICA=${REDIS_HOST_REPLICA}
      - REDIS_PORT_REPLICA=${REDIS_PORT_REPLICA}
      - REDIS_PASSWORD_REPLICA=${REDIS_PASSWORD_REPLICA}
    networks:
      - redis-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  memtier_benchmark:
    profiles: ["benchmark"]
    image: redislabs/memtier_benchmark
    container_name: memtier_benchmark
    command: --ratio=1:0 --test-time=60 --rate-limiting=100 -t 2 -c 50 --key-pattern=P:P --key-maximum 100 --server=${REDIS_HOST} --port=${REDIS_PORT} -a ${REDIS_PASSWORD} --out-file=/benchmark-data/outfile
    volumes:
      - ./output:/benchmark-data

  script_numbers:
    profiles: ["scripts"]
    build:
      context: ./scripts
      dockerfile: Dockerfile
    container_name: script_numbers
    environment:
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - ./scripts:/scripts

networks:
  redis-network:
    driver: bridge

volumes:
  redis-data:
    driver: local
  redis-backups:
    driver: local