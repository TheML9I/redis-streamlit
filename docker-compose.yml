version: '3.8'

services:
  redis:
    image: redis:7.4
    container_name: redis-ha
    command: >
      redis-server 
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 1gb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 512M
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    sysctls:
      net.core.somaxconn: 1024
    environment:
      - TZ=UTC
    networks:
      - redis-network

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: redis-exporter
    restart: unless-stopped
    ports:
      - "9121:9121"
    environment:
      - REDIS_ADDR=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    depends_on:
      - redis
    networks:
      - redis-network

  redis-backup:
    image: redis:7.4
    container_name: redis-backup
    volumes:
      - redis-backups:/backups
      - ./redis/backup-script.sh:/backup-script.sh
    entrypoint: ["/bin/bash", "-c"]
    command: >
      "chmod +x /backup-script.sh &&
       echo '0 */6 * * * /backup-script.sh' > /etc/crontabs/root &&
       crond -f -d 8"
    depends_on:
      - redis
    networks:
      - redis-network

  streamlit-app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: streamlit-redis-app
    restart: unless-stopped
    ports:
      - "8501:8501"
    volumes:
      - ./app:/app
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    depends_on:
      - redis
    networks:
      - redis-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  redis-network:
    driver: bridge

volumes:
  redis-data:
    driver: local
  redis-backups:
    driver: local